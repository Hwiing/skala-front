<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 여행 앨범</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Travel archive</p>
      <h1>📷 나의 여행 앨범</h1>
      <p class="lead">광저우에서 마주한 풍경과 기억에 남는 순간들을 담았습니다.</p>
    </header>

    <section>
      <h2>나의 여행 사진</h2>
      <div class="trip-grid">
        <figure class="trip-card">
          <img src="../media/image1.jpg" alt="광저우 거리의 디저트 가게">
          <figcaption>광저우 에그타르트 (2026년)</figcaption>
        </figure>
        <figure class="trip-card">
          <img src="../media/image2.jpg" alt="비행기 창밖으로 보이는 하늘">
          <figcaption>광저우로 향하는 하늘 (2026년)</figcaption>
        </figure>
      </div>
    </section>

    <section class="section">
      <h2>🎬 여행 하이라이트</h2>
      <div class="highlight-layout">
        <figure class="video-card">
          <video controls playsinline preload="metadata" poster="../media/image2.jpg">
            <source src="../media/video1.mp4" type="video/mp4">
            브라우저가 영상 재생을 지원하지 않습니다.
          </video>
          <figcaption>기내식 언박싱 영상 (2026년)</figcaption>
        </figure>

        <figure class="rainbow-composite">
          <img src="../media/bottomimg.png" alt="무지개빛 문양으로 장식한 여행 이미지">
          <span class="rainbow-composite__mask" aria-hidden="true"></span>
        </figure>
      </div>
    </section>

    <section class="card section">
      <h2>🎵 여행의 배경음악</h2>
      <p class="lead">사진과 함께 여행의 분위기를 감상해 보세요.</p>
      <audio controls>
        <source src="../media/music.mp3" type="audio/mpeg">
        브라우저가 오디오 재생을 지원하지 않습니다.
      </audio>
    </section>

    <div class="actions"><a class="home-link" href="../index.html">🏠 홈으로 돌아가기</a></div>
  </main>
  <script src="../script/reflective-tilt.js"></script>
</body>
</html>
